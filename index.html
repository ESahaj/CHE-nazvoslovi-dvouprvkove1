<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Názvosloví anorganických sloučenin</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --ink: #111827;
      --muted: #5b6472;
      --paper: rgba(255,255,255,0.88);
      --blue: #2563eb;
      --green: #16a34a;
      --red: #ef4444;
      --shadow: 0 18px 48px rgba(17, 24, 39, 0.13);
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 20%, rgba(239,68,68,.18), transparent 28%),
        radial-gradient(circle at 85% 15%, rgba(22,163,74,.18), transparent 26%),
        radial-gradient(circle at 50% 100%, rgba(37,99,235,.16), transparent 35%),
        #eef1f5;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .shell {
      width: min(1060px, 100%);
      display: grid;
      gap: 22px;
    }
    .hero {
      position: relative;
      overflow: hidden;
      background: var(--paper);
      border: 2px solid rgba(17,24,39,.22);
      border-radius: 28px;
      padding: clamp(24px, 4vw, 42px);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 9px 13px;
      border-radius: 999px;
      background: rgba(37,99,235,.10);
      color: #1d4ed8;
      font-weight: 800;
      letter-spacing: .04em;
      text-transform: uppercase;
      font-size: .82rem;
      margin-bottom: 16px;
    }
    h1 {
      margin: 0;
      font-size: clamp(34px, 6vw, 72px);
      line-height: .98;
      letter-spacing: .035em;
    }
    .subtitle {
      max-width: 760px;
      margin: 14px 0 0;
      color: var(--muted);
      font-size: clamp(17px, 2.3vw, 22px);
      line-height: 1.4;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }
    .card {
      position: relative;
      overflow: hidden;
      min-height: 190px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-decoration: none;
      color: var(--ink);
      background: rgba(255,255,255,.90);
      border: 2px solid rgba(17,24,39,.24);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 18px 45px rgba(17, 24, 39, 0.10);
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }
    .card:hover, .card:focus-visible {
      transform: translateY(-4px);
      box-shadow: 0 24px 60px rgba(17, 24, 39, 0.16);
      border-color: rgba(37,99,235,.55);
      outline: none;
    }
    .card::after {
      content: "";
      position: absolute;
      width: 220px;
      height: 220px;
      right: -80px;
      bottom: -90px;
      border-radius: 50%;
      opacity: .18;
    }
    .card.blue::after { background: var(--blue); }
    .card.green::after { background: var(--green); }
    .kicker {
      font-family: Arial, sans-serif;
      font-size: .85rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .12em;
      color: var(--muted);
    }
    .card h2 {
      margin: 10px 0 6px;
      font-size: clamp(28px, 4vw, 44px);
      line-height: 1;
    }
    .card p {
      margin: 0;
      color: var(--muted);
      font-size: 1.08rem;
      line-height: 1.35;
      max-width: 430px;
    }
    .cta {
      position: relative;
      z-index: 1;
      display: inline-flex;
      width: fit-content;
      align-items: center;
      gap: 10px;
      margin-top: 18px;
      padding: 12px 16px;
      border-radius: 14px;
      font-family: Arial, sans-serif;
      font-weight: 900;
      color: white;
      background: var(--ink);
    }
    .mini {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      color: var(--muted);
      font-family: Arial, sans-serif;
      font-size: .92rem;
    }
    .pill {
      background: rgba(255,255,255,.7);
      border: 1.5px solid rgba(17,24,39,.22);
      border-radius: 999px;
      padding: 8px 12px;
    }
    @media (max-width: 780px) {
      body { padding: 16px; align-items: start; }
      .cards { grid-template-columns: 1fr; }
      .hero, .card { border-radius: 22px; padding: 24px; }
      .card { min-height: 210px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <div class="badge">Interaktivní procvičování</div>
      <h1>Názvosloví<br>anorganických sloučenin</h1>
      <p class="subtitle">Vyber si směr procvičování.</p>
    </section>

    <section class="cards" aria-label="Výběr aktivity">
      <a class="card blue" href="01_vzorec_na_nazev/index.html">
        <div>
          <div class="kicker">Aktivita 1</div>
          <h2>Vzorec → název</h2>
          <p>Doplň údaje a sestav název.</p>
        </div>
        <span class="cta">Spustit procvičování →</span>
      </a>

      <a class="card green" href="02_nazev_na_vzorec/index.html">
        <div>
          <div class="kicker">Aktivita 2</div>
          <h2>Název → vzorec</h2>
          <p>Doplň údaje a sestav vzorec.</p>
        </div>
        <span class="cta">Spustit procvičování →</span>
      </a>
    </section>

    <div class="mini">
      <span class="pill">kontrola</span>
      <span class="pill">nápověda</span>
      <span class="pill">návrat na úvod</span>
    </div>
  </main>
</body>
</html>
