<html lang="cs">
<head>

<title>Názvosloví – vzorec → název</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #ececec;
    font-family: Georgia, "Times New Roman", serif;
    color: #111;
  }
  .app {
    width: min(100vw, 1800px);
    margin: 0 auto;
  }
  .board {
    position: relative;
    width: 100%;
    aspect-ratio: 2048 / 804;
    background: url('board.jpg') center / 100% 100% no-repeat;
    overflow: hidden;
  }
  .givenFormula, .field {
    position: absolute;
    background: transparent;
    border: 0;
    outline: none;
    box-shadow: none;
    margin: 0;
    color: #111111;
    font-family: "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
    font-weight: 600;
    z-index: 5;
  }
  .givenFormula {
    pointer-events: none;
    font-size: clamp(26px, 3.35vw, 64px);
    z-index: 3;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    line-height: 1;
    padding-top: 0.03em;
  }
  .field {
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    padding: 0.05em 0.08em 0.02em;
    line-height: 1;
    font-size: clamp(20px, 2.65vw, 48px);
    caret-color: #111111;
    user-select: text;
  }
  .field.small {
    font-size: clamp(17px, 2.05vw, 34px);
  }
  .field.name-sm {
    font-size: clamp(18px, 2.15vw, 36px);
  }
  .field[contenteditable="true"]:empty::before {
    content: "";
  }
  .field::selection {
    background: rgba(37, 99, 235, 0.18);
  }

  .field:focus {
    box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.35);
    border-radius: 8px;
  }
  .field.ok { box-shadow: 0 0 0 3px rgba(22,163,74,0.75); border-radius: 8px; }
  .field.bad { box-shadow: 0 0 0 3px rgba(220,38,38,0.75); border-radius: 8px; }
  .field::placeholder { color: transparent; }

  /* pozice přesně nad původními políčky v podkladu */
  #givenFormula     { left: 41.05%; top: 19.1%; width: 16.55%; height: 11.90%; }

  #inputElement     { left: 33.98%; top: 44.3%; width: 6.10%; height: 15.20%; }
  #inputElementOx   { left: 40.6%; top: 41.2%; width: 3.42%; height: 7.55%; }

  #inputAnionParticle { left: 45.32%; top: 44.3%; width: 5.28%; height: 15.15%; }
  #inputAnionOx     { left: 51.2%; top: 41.2%; width: 3.82%; height: 7.55%; }

  #inputElementCount { left: 40.6%; top: 56.2%; width: 3.22%; height: 7.92%; }
  #inputAnionCount  { left: 51.35%; top: 56.2%; width: 3.48%; height: 7.92%; }

  #inputAnionName   { left: 26.84%; top: 83.28%; width: 14.35%; height: 9.95%; }
  #inputStem        { left: 46.20%; top: 83.28%; width: 13.35%; height: 9.88%; }
  #inputSuffix      { left: 62.62%; top: 83.28%; width: 9.08%; height: 9.88%; }

  .controls {
    display: grid;
    grid-template-columns: repeat(2, minmax(140px, 220px));
    justify-content: center;
    gap: 10px;
    padding: 12px;
    background: #fff;
    border-top: 1px solid #d6d6d6;
  }
  button {
    border: 0;
    border-radius: 12px;
    padding: 12px 10px;
    font-size: 1rem;
    font-weight: 800;
    cursor: pointer;
  }
  .check { background: #2563eb; color: white; }
  .solution { background: #e5e7eb; color: #111; }
  .next { background: #16a34a; color: white; }
  .home {
    grid-column: 1 / -1;
    background: #111827;
    color: white;
    text-decoration: none;
    border-radius: 12px;
    padding: 12px 10px;
    font-size: 1rem;
    font-weight: 800;
    cursor: pointer;
    text-align: center;
    font-family: Arial, sans-serif;
  }
  .home:hover { background: #374151; }
  .message { display: none; padding: 14px 16px; font-weight: 700; line-height: 1.5; background:#fff; }
  .message.ok { display:block; background:#bbf7d0; color:#14532d; }
  .message.bad { display:block; background:#fecaca; color:#7f1d1d; }
  .message.info { display:block; background:#fef3c7; color:#78350f; }
  .legend { padding: 10px 16px 16px; font-size: 0.97rem; background:#fff; color:#333; }
  @media (max-width: 820px) {
    button { font-size: 0.92rem; padding: 10px 8px; }
    .controls { grid-template-columns: 1fr 1fr; }
    .legend { font-size: 0.9rem; }
  }

  .givenFormula, .given, .field {
    color: #111111 !important;
    font-family: "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif !important;
    font-weight: 600 !important;
  }

  .field {
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    text-align: center !important;
    white-space: nowrap !important;
    overflow: hidden !important;
    line-height: 1 !important;
    padding: 0.16em 0.08em 0 !important;
    caret-color: #111111 !important;
    user-select: text !important;
  }

  .field.small {
    padding-top: 0.12em !important;
  }

  .field.formula {
    padding-top: 0.18em !important;
  }

  .given, .givenFormula {
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    text-align: center !important;
    line-height: 1 !important;
    padding-top: 0.08em !important;
  }

  .field:focus {
    box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.35) !important;
    border-radius: 8px !important;
  }

  .field.ok {
    box-shadow: 0 0 0 3px rgba(22,163,74,0.78) !important;
    border-radius: 8px !important;
  }

  .field.bad {
    box-shadow: 0 0 0 3px rgba(220,38,38,0.78) !important;
    border-radius: 8px !important;
  }

</style>

<body>
  <main class="app">
    <section class="board" aria-label="Interaktivní podklad pro názvosloví – zadaný vzorec nahoře">
      <div id="givenFormula" class="givenFormula" aria-label="zadaný vzorec"></div>

      <div id="inputElement" class="field" contenteditable="true" spellcheck="false" role="textbox" aria-label="značka prvku" tabindex="1"></div>
      <div id="inputElementOx" class="field small" contenteditable="true" spellcheck="false" role="textbox" aria-label="oxidační číslo prvku římskou číslicí" tabindex="6"></div>

      <div id="inputAnionParticle" class="field" contenteditable="true" spellcheck="false" role="textbox" aria-label="částice podstatného jména" tabindex="3"></div>
      <div id="inputAnionOx" class="field small" contenteditable="true" spellcheck="false" role="textbox" aria-label="oxidační číslo aniontu římskou číslicí se znaménkem" tabindex="5"></div>

      <div id="inputElementCount" class="field small" contenteditable="true" spellcheck="false" role="textbox" aria-label="počet atomů prvku" tabindex="2"></div>
      <div id="inputAnionCount" class="field small" contenteditable="true" spellcheck="false" role="textbox" aria-label="počet atomů nebo skupin aniontu" tabindex="4"></div>

      <div id="inputAnionName" class="field name-sm" contenteditable="true" spellcheck="false" role="textbox" aria-label="podstatné jméno" tabindex="7"></div>
      <div id="inputStem" class="field name-sm" contenteditable="true" spellcheck="false" role="textbox" aria-label="přídavné jméno – kmen prvku" tabindex="8"></div>
      <div id="inputSuffix" class="field name-sm" contenteditable="true" spellcheck="false" role="textbox" aria-label="koncovka oxidačního čísla" tabindex="9"></div>
    </section>

    <section class="controls">
      <button class="check" id="checkBtn">Zkontrolovat</button>
      <button class="solution" id="solutionBtn">Nápověda</button>
      <button class="next" id="nextBtn">Další sloučenina</button>
      <a class="home" href="../index.html" aria-label="Zpět na úvodní stránku">← Zpět na úvod</a>
    </section>

    <div id="message" class="message"></div>
    <div class="legend">
      1.Opiš vzorec včetně počtu atomů - 2.Doplň oxidační číslo aniontu (nápověda v červeném poli vlevo) - 3.Dopočítej oxidační číslo kationtu a urči koncovku - 4.Sestav název
    </div>
  </main>

  function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
  }

  function mixTasksByAnion(originalTasks) {
    const groups = {};
    originalTasks.forEach((task) => {
      if (!groups[task.anion]) groups[task.anion] = [];
      groups[task.anion].push(task);
    });
    Object.values(groups).forEach(shuffleArray);
    const mixed = [];
    let previousAnion = null;
    while (mixed.length < originalTasks.length) {
      const availableAnions = Object.keys(groups).filter((anion) => groups[anion].length > 0);
      let choices = availableAnions.filter((anion) => anion !== previousAnion);
      if (choices.length === 0) choices = availableAnions;
      choices.sort((a, b) => groups[b].length - groups[a].length || Math.random() - 0.5);
      const topCount = groups[choices[0]].length;
      const bestChoices = choices.filter((anion) => groups[anion].length === topCount);
      const selectedAnion = bestChoices[Math.floor(Math.random() * bestChoices.length)];
      mixed.push(groups[selectedAnion].pop());
      previousAnion = selectedAnion;
    }
    return mixed;
  }

  function normalizeFormula(value) {
    return String(value)
      .replaceAll('₀', '0').replaceAll('₁', '1').replaceAll('₂', '2').replaceAll('₃', '3').replaceAll('₄', '4')
      .replaceAll('₅', '5').replaceAll('₆', '6').replaceAll('₇', '7').replaceAll('₈', '8').replaceAll('₉', '9');
  }

  function parseCounts(formula, element, anionParticle) {
    const f = normalizeFormula(formula);
    if (!f.startsWith(element)) return { elementCount: '1', anionCount: '1' };
    let rest = f.slice(element.length);
    const elementMatch = rest.match(/^(\d+)/);
    const elementCount = elementMatch ? elementMatch[1] : '1';
    if (elementMatch) rest = rest.slice(elementMatch[1].length);
    let anionCount = '1';
    if (rest.startsWith('(' + anionParticle + ')')) {
      const tail = rest.slice(anionParticle.length + 2);
      const m = tail.match(/^(\d+)/);
      anionCount = m ? m[1] : '1';
    } else if (rest.startsWith(anionParticle)) {
      const tail = rest.slice(anionParticle.length);
      const m = tail.match(/^(\d+)/);
      anionCount = m ? m[1] : '1';
    }
    return { elementCount, anionCount };
  }

  function enrichTask(task) {
    const counts = parseCounts(task.formula, task.element, task.anionParticle);
    return { ...task, elementCount: counts.elementCount, anionCount: counts.anionCount };
  }

  tasks = mixTasksByAnion(tasks).map(enrichTask);

  const inputs = [
    ['inputElement', 'element'],
    ['inputElementOx', 'oxRoman'],
    ['inputAnionParticle', 'anionParticle'],
    ['inputAnionOx', 'anionChargeTop'],
    ['inputElementCount', 'elementCount'],
    ['inputAnionCount', 'anionCount'],
    ['inputAnionName', 'anion'],
    ['inputStem', 'stem'],
    ['inputSuffix', 'suffix']
  ];

  let current = 0;
  const el = (id) => document.getElementById(id);

  function normalizeText(value) {
    return String(value)
      .trim()
      .toLowerCase()
      .replaceAll(' ', '')
      .replaceAll('.', '')
      .replaceAll('−', '-')
      .replaceAll('–', '-')
      .normalize('NFC');
  }



  function getFieldValue(id) {
    return el(id).textContent || '';
  }

  function setFieldValue(id, value) {
    el(id).textContent = value;
  }

  function focusEditable(id) {
    const node = el(id);
    node.focus();
    const range = document.createRange();
    range.selectNodeContents(node);
    range.collapse(false);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  const tabOrder = ["inputElement", "inputElementCount", "inputAnionParticle", "inputAnionCount", "inputAnionOx", "inputElementOx", "inputAnionName", "inputStem", "inputSuffix"];

  function setupCustomTabOrder() {
    tabOrder.forEach((id, index) => {
      const node = el(id);
      node.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          event.preventDefault();
          return;
        }
        if (event.key !== 'Tab') return;
        event.preventDefault();
        const step = event.shiftKey ? -1 : 1;
        const nextIndex = (index + step + tabOrder.length) % tabOrder.length;
        focusEditable(tabOrder[nextIndex]);
      });
      node.addEventListener('paste', (event) => {
        event.preventDefault();
        const text = (event.clipboardData || window.clipboardData).getData('text');
        document.execCommand('insertText', false, text.replace(/[\r\n]+/g, ' '));
      });
    });
  }

  function clearFields() {
    inputs.forEach(([id]) => {
      el(id).textContent = '';
      el(id).classList.remove('ok', 'bad');
    });
    el('message').className = 'message';
    el('message').innerHTML = '';
  }

  function loadTask() {
    const task = tasks[current];
    el('givenFormula').textContent = task.formula;
    clearFields();
    setTimeout(() => focusEditable('inputElement'), 0);
  }

  function checkAnswers() {
    const task = tasks[current];
    let allOk = true;
    inputs.forEach(([id, key]) => {
      const ok = normalizeText(getFieldValue(id)) === normalizeText(task[key]);
      el(id).classList.toggle('ok', ok);
      el(id).classList.toggle('bad', !ok);
      if (!ok) allOk = false;
    });
    const fullName = `${task.anion} ${task.stem}${task.suffix}`;
    el('message').className = 'message ' + (allOk ? 'ok' : 'bad');
    el('message').innerHTML = allOk
      ? `Správně ✅ Výsledný název je <strong>${fullName}</strong>.`
      : 'Něco nesedí ❌ Oprav červeně orámovaná políčka.';
  }

  function showSolution() {
    const task = tasks[current];
    inputs.forEach(([id, key]) => {
      setFieldValue(id, task[key]);
      el(id).classList.remove('bad');
      el(id).classList.add('ok');
    });
    const fullName = `${task.anion} ${task.stem}${task.suffix}`;
    el('message').className = 'message info';
    el('message').innerHTML =
      `<strong>Řešení je doplněné do políček.</strong><br>` +
      `Vzorec: <strong>${task.formula}</strong><br>` +
      `Výsledný název: <strong>${fullName}</strong>.`;
  }

  function nextTask() {
    current = (current + 1) % tasks.length;
    loadTask();
  }

  el('checkBtn').addEventListener('click', checkAnswers);
  el('solutionBtn').addEventListener('click', showSolution);
  el('nextBtn').addEventListener('click', nextTask);
  document.addEventListener('keydown', (event) => { if (event.key === 'Enter') checkAnswers(); });
  setupCustomTabOrder();
  loadTask();
</script>
